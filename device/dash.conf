# /etc/upstart/dash.conf on the Kindle — start the budget-box display once the system is up.
# Installed by device/install.sh. The script itself stops the stock reader UI (framework).
description "budget-box display"
start on started framework
stop on stopping lab126_gui
respawn
respawn limit 10 60
exec /bin/sh /mnt/us/dash/dash.sh
